# yaml-language-server: $schema=https://blue-build.org
name: oglaroon-gg
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/oglaroon
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "oglaroon-gg"
  - type: kargs
    kargs:
      - pcie_aspm=off
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - piper
        - obs-studio
        - obs-studio-plugin-vaapi
        - steam-devices
        - gamemode
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton-GE
          - com.valvesoftware.Steam.Utility.steamtinkerlaunch
          - org.freedesktop.Platform.VulkanLayer.gamescope
          - org.freedesktop.Platform.VulkanLayer.MangoHud
          - dev.lizardbyte.app.Sunshine
  - type: files
    files:
      - source: extras/99-cpu-governor.rules
        destination: /etc/udev/rules.d/99-cpu-governor.rules
      - source: extras/99-workstation-perf.conf
        destination: /etc/sysctl.d/99-workstation-perf.conf
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
